# Sites that uptime-pinger will check.
# interval: seconds to wait between rounds of checks (minimum 5).
interval: 60

sites:
  - name: Google
    url: https://www.google.com

  - name: GitHub
    url: https://github.com
    timeout: 5            # seconds to wait before calling it "down"

  - name: Python.org
    url: https://www.python.org
    expected_status: 200  # the HTTP status code that means "healthy"

  - name: lutfulkabir.me
    url: https://lutfulkabir.me
    expected_status: 200
    timeout: 10
